<!DOCTYPE html>
<html lang="ru" class="ds-app-viewport" data-ds-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#171717" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Party Menu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Inter:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="vendor/ds/design-system/index.css" />
    <link rel="stylesheet" href="css/party-brand.css" />
    <link rel="stylesheet" href="css/app.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div class="app">
      <!-- Главная: приглашение -->
      <section id="screen-home" class="screen screen--hero" aria-label="Приглашение">
        <main class="screen-body screen-body--hero">
          <img
            id="hero-photo-home"
            class="hero-photo"
            src="assets/images/home-invite.jpg"
            alt="Приглашение на день рождения"
            width="480"
            height="854"
          />
        </main>
        <footer class="ds-screen-footer" data-ds-screen-footer data-variant="solid">
          <button
            type="button"
            id="btn-home-start"
            class="ds-button"
            data-variant="primary"
            data-block="true"
          >
            Я пойду
          </button>
        </footer>
      </section>

      <!-- Форма меню (шаги 1–4) -->
      <section id="screen-form" class="screen screen--form hidden" aria-label="Меню">
        <header
          id="form-header"
          class="ds-header"
          data-ds-header
          data-variant="back"
          data-title="Меню"
          data-stepper-current="1"
          data-stepper-total="4"
        >
          <button
            type="button"
            id="btn-form-back"
            class="ds-header__start ds-button"
            data-variant="secondary-icon"
            aria-label="Назад"
          >
            <i class="ds-icon ds-icon--sm ri-arrow-left-line" aria-hidden="true"></i>
          </button>
          <div class="ds-header__content">
            <h1 class="ds-header__title">Меню</h1>
          </div>
          <div class="ds-header__trail">
            <p class="ds-header__stepper" id="form-stepper" aria-live="polite">
              <span class="ds-header__stepper-current">1</span><span class="ds-header__stepper-sep"> / </span
              ><span class="ds-header__stepper-total">4</span>
            </p>
          </div>
        </header>

        <main class="screen-body">
          <h2 id="form-step-heading" class="ds-text-headline-lg ds-form-step__headline"></h2>
          <div id="form-step-panel"></div>
        </main>

        <footer class="ds-screen-footer" data-ds-screen-footer data-variant="ghost" data-overlay="true" data-label="Далее">
          <button
            type="button"
            id="btn-form-next"
            class="ds-button"
            data-variant="primary"
            data-block="true"
            data-ds-screen-footer-button
          ></button>
        </footer>
      </section>

      <!-- Успех -->
      <section id="screen-success" class="screen screen--hero hidden" aria-label="Готово">
        <main class="screen-body screen-body--hero">
          <img
            id="hero-photo-success"
            class="hero-photo"
            src="assets/images/success-photo.jpg"
            alt="До встречи на празднике"
            width="480"
            height="854"
          />
        </main>
        <footer
          class="ds-screen-footer"
          data-ds-screen-footer
          data-variant="solid-dual"
          data-secondary-label="Добавить в календарь"
          data-label="Добавить еще человека"
        >
          <div class="ds-screen-footer__actions">
            <button
              type="button"
              id="btn-add-calendar"
              class="ds-button"
              data-variant="secondary"
              data-block="true"
              data-ds-screen-footer-secondary
            >
              Добавить в календарь
            </button>
            <button
              type="button"
              id="btn-add-person"
              class="ds-button"
              data-variant="primary"
              data-block="true"
              data-ds-screen-footer-button
            >
              Добавить еще человека
            </button>
          </div>
        </footer>
      </section>

      <div
        class="ds-drawer-root dish-detail-root"
        id="dish-detail-drawer"
        data-ds-drawer
        data-state="closed"
        aria-hidden="true"
      >
        <div class="ds-drawer-overlay" data-ds-drawer-close aria-hidden="true"></div>
        <div class="ds-drawer-content dish-detail" data-direction="bottom">
          <div class="ds-drawer-header dish-detail__header">
            <button
              type="button"
              class="ds-button"
              data-variant="secondary-icon"
              data-ds-drawer-close
              aria-label="Закрыть"
            >
              <i class="ds-icon ds-icon--sm ri-close-line" aria-hidden="true"></i>
            </button>
          </div>
          <div class="ds-drawer-body dish-detail__body">
            <img
              id="dish-detail-image"
              class="dish-detail__photo"
              alt=""
              width="480"
              height="360"
              decoding="async"
            />
            <h2 id="dish-detail-title" class="ds-drawer-title dish-detail__title"></h2>
            <p id="dish-detail-description" class="ds-drawer-description dish-detail__description"></p>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
